<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка math.js</title>
<style>
  :root{color-scheme:dark;--bg:#0a0d14;--text:#e6e9ef;--mute:#8b95a5;--ok:#22c55e;--bad:#f0525f}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
  h1{font-size:18px;margin:0 0 4px}p{color:var(--mute);margin:0 0 16px}
  #sum{font-weight:700;margin:0 0 12px}.ok{color:var(--ok)}.bad{color:var(--bad)}
  li{margin:2px 0}code{color:var(--mute)}
</style>
</head>
<body>
<h1>Проверка math.js</h1>
<p>Синтетические свечи с фиксированным зерном, без сети. <code>?ref=_ref/math.js</code> — сравнить с прежней версией (сохраняется перед правкой: <code>git show HEAD:supabase/functions/_shared/math.js &gt; tests/_ref/math.js</code>).</p>
<div id="sum">Считаю…</div>
<ol id="out"></ol>
<script type="module">
// Checks for the shared strategy math (supabase/functions/_shared/math.js): position sizing with and without compounding,
// the drawdown, and — given ?ref=<an older copy> — that a change left the rest of the behaviour exactly as it was.
// Run it in the preview after every change to math.js; window.__TEST holds the counts for scripted runs.
import * as M from '../supabase/functions/_shared/math.js';
const out = document.getElementById('out'), res = {pass:0, fail:0, failed:[]};
const check = (name, ok, info = '') => {
  ok ? res.pass++ : (res.fail++, res.failed.push(name));
  const li = document.createElement('li'); li.className = ok ? 'ok' : 'bad';
  li.textContent = `${ok ? 'PASS' : 'FAIL'} — ${name}${info ? ' · ' + info : ''}`; out.append(li);
};

// ---------- candles: a seeded random walk with a sharp move now and then, so the bands get touched and reversals happen ----------
const rng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const TF = '1h', TFMS = M.TFMS[TF], T0 = Date.UTC(2025, 0, 1), BARS = 1400, WARM = 400;
function series(seed) {
  const R = rng(seed), K = []; let p = 50 + 100 * R();
  for (let i = 0; i < BARS; i++) {
    const o = p; let ch = (R() - 0.5) * 0.02;
    if (R() < 0.025) ch += (R() < 0.5 ? -1 : 1) * (0.04 + R() * 0.05);
    p = Math.max(0.01, p * (1 + ch));
    K.push([T0 + i * TFMS, o, Math.max(o, p) * (1 + R() * 0.006), Math.min(o, p) * (1 - R() * 0.006), p, 1000 * (1 + R()) * (Math.abs(ch) > 0.03 ? 3 : 1), T0 + (i + 1) * TFMS - 1]);
  }
  return K;
}
const hist = {};
['AAAUSDT', 'BBBUSDT', 'CCCUSDT', 'DDDUSDT', 'EEEUSDT', 'FFFUSDT', 'GGGUSDT', 'HHHUSDT', ...M.MAJORS].forEach((s, i) => { hist[s] = series(1000 + i * 7); });
const from = T0 + WARM * TFMS;

const BASE = {method:'log', N:100, k:2, tf:TF, minScore:0, strategy:'revert', rr:0, risk:0.01, lev:10, maxOpen:3, timeStop:48, regimeSrc:'majors', erMax:0.25};
const VARIANTS = {
  'отскок к центру, риск 1%': BASE,
  'RR 1:2, плечо 3×': {...BASE, rr:2, lev:3},
  'переключатель, robust, риск 2%': {...BASE, strategy:'switch', method:'robust', k:2.5, risk:0.02},
};
const bt = (Mod, S, start) => Mod.backtest(hist, S, {start, from});
const riskOf = x => Math.abs(x.entry - x.sl) * x.qty;
const timing = x => [x.sym, x.side, x.time, x.tclose, x.reason, x.entry, x.exit].join('|');
const near = (a, b, rel = 1e-9) => Math.abs(a - b) <= rel * Math.max(1, Math.abs(a), Math.abs(b));

// ---------- 1. sizing: compounding and a fixed stake ----------
for (const [name, S] of Object.entries(VARIANTS)) {
  for (const start of [10000, 2500]) {
    const c = bt(M, S, start), f = bt(M, {...S, fixedRisk:true}, start);
    check(`${name}, старт ${start}: есть сделки`, c.trades.length >= 5, `${c.trades.length} сделок`);
    // sizing never decides whether or when to trade: the same entries and exits, only the amounts differ
    check(`${name}, старт ${start}: без сложного процента те же входы и выходы`, c.trades.map(timing).join() === f.trades.map(timing).join());
    // a fixed stake: no stop above start × risk; most at exactly that (a few can be lower, held back by the leverage cap)
    const cap = start * S.risk, fr = f.trades.map(riskOf);
    check(`${name}, старт ${start}: фиксированный риск ≤ ${cap}`, fr.every(r => r <= cap * (1 + 1e-9)), `макс. ${Math.max(...fr).toFixed(4)}`);
    check(`${name}, старт ${start}: фиксированный риск ровно ${cap} у большинства`, fr.filter(r => near(r, cap)).length >= fr.length / 2, `${fr.filter(r => near(r, cap)).length} из ${fr.length}`);
    // compounding: the first stop is start × risk (the balance is still the start), later ones follow the balance
    const cr = c.trades.map(riskOf);
    check(`${name}, старт ${start}: со сложным процентом первый стоп = ${cap}`, near(cr[0], cap) || cr[0] < cap, cr[0].toFixed(4));
    check(`${name}, старт ${start}: со сложным процентом стоп меняется с балансом`, cr.some(r => !near(r, cap)));
    // the drawdown: journalStats against a plain recount
    let eq = start, pk = start, dd = 0;
    for (const x of [...c.trades].sort((a, b) => a.tclose - b.tclose)) { eq += x.pnl; pk = Math.max(pk, eq); dd = Math.max(dd, (pk - eq) / pk); }
    check(`${name}, старт ${start}: просадка journalStats совпадает с пересчётом`, M.journalStats(start, c.trades).maxDD === dd * 100, `${(dd * 100).toFixed(2)}%`);
    if (start === 10000) check(`${name}: снимок сделки помнит фиксированный риск`, f.trades.every(x => x.snap?.settings?.fixedRisk === true) && c.trades.every(x => !('fixedRisk' in (x.snap?.settings || {}))));
  }
}

// ---------- 2. planEntry directly, on the row of a real backtest entry ----------
{
  const S = VARIANTS['отскок к центру, риск 1%'], first = bt(M, S, 10000).trades[0];
  const T = first.time - TFMS + 1, Q = M.prepare(hist[first.sym], S), i = Q.t.indexOf(T), r = M.signalAt(Q, i, first.sym, T + TFMS, true);
  r.mkt = null;
  const p = (bal, s, start) => M.planEntry(r, bal, s, T + TFMS - 1, start);
  check('planEntry: строка входа восстановлена', !!p(10000, S, 10000), first.sym);
  if (p(10000, S, 10000)) {
    check('planEntry: сложный процент — риск от баланса', near(p(20000, S, 10000).risk, 200));
    check('planEntry: фиксированный — риск от старта', near(p(20000, {...S, fixedRisk:true}, 10000).risk, 100));
    check('planEntry: фиксированный при балансе ниже старта — всё равно от старта', near(p(6000, {...S, fixedRisk:true}, 10000).risk, 100));
    check('planEntry: без старта фиксированный риск = от баланса (безопасно для старых вызовов)', near(p(20000, {...S, fixedRisk:true}).risk, 200));
    check('planEntry: ограничение по плечу — от баланса, не от старта', p(1000, {...S, fixedRisk:true, lev:1}, 10000).entry * p(1000, {...S, fixedRisk:true, lev:1}, 10000).qty <= 1000 / 3 * (1 + 1e-9));
  }
}

// ---------- 2b. walls in the book (wallsOf): the coin card, «Графики» and the bot read one rule ----------
{
  const bids = [], asks = [];
  for (let i = 1; i <= 100; i++) { bids.push([(100 - i * 0.01).toFixed(2), i === 50 ? '2000' : '10']); asks.push([(100 + i * 0.01).toFixed(2), i === 40 ? '1500' : '10']); }
  const step = M.bookStep(100), bk = M.bookBins(bids, asks, 100, 0.02, step), W = M.wallsOf(bk);
  check('стенки: шаг корзины ≈ 0.05 % цены', step === 0.05, step);
  check('стенки: по одной с каждой стороны, где лежит крупная заявка', W.length === 2 && Math.abs(W.find(w => w.side === 'bid')?.price - 99.5) < 1e-9 && Math.abs(W.find(w => w.side === 'ask')?.price - 100.4) < 1e-9, JSON.stringify(W.map(w => [w.side, +w.price.toFixed(4), Math.round(w.usd)])));
  const mapBk = M.bookBins(new Map(bids.map(([p, q]) => [+p, +q])), new Map(asks.map(([p, q]) => [+p, +q])), 100, 0.02, step);
  check('стенки: стакан строками Binance и Map дают одно и то же', JSON.stringify(M.wallsOf(mapBk)) === JSON.stringify(W));
  // the rule «Графики» had inline before 2.89
  const all = [...bk.bid.values(), ...bk.ask.values()].sort((a, b) => a - b), med = all[all.length >> 1] || 0;
  const pick = (m, side) => [...m].filter(([, v]) => v >= med * 5 && v >= 2e4).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k, v]) => ({price:k * bk.step, usd:v, side}));
  check('стенки: то же правило, что было в «Графиках»', JSON.stringify([...pick(bk.ask, 'ask'), ...pick(bk.bid, 'bid')]) === JSON.stringify(W));
  check('стенки: порог «не меньше» отсекает', M.wallsOf(bk, undefined, {min:1e9}).length === 0);
  // the bot's record at signals (signal_books): how far the snapshot reaches and the dollars within 0.5 / 1 %
  check('стакан: охват — по короткой стороне', Math.abs(M.bookReach(bids, asks, 100) - 0.01) < 1e-9, M.bookReach(bids, asks, 100));
  // the shares sit a hair past a level (100 × 1.005 is 100.49999… in floating point: a level exactly on the edge is a coin toss)
  const sm = M.bookSums(bids, asks, 100, [0.00505, 0.01005]), near = (a, b) => Math.abs(a - b) < 1e-6;
  const exp = (L, n) => L.slice(0, n).reduce((s, [p, q]) => s + p * q, 0);
  check('стакан: суммы в ±0.5 % и ±1 %', near(sm.bid[0], exp(bids, 50)) && near(sm.bid[1], exp(bids, 100)) && near(sm.ask[0], exp(asks, 50)) && near(sm.ask[1], exp(asks, 100)),
    JSON.stringify({bid:sm.bid.map(Math.round), ask:sm.ask.map(Math.round)}));
}

// ---------- 2c. a coin whose candles stop (delisted, trading halted): the time stop counts time, not the coin's candles ----------
{
  const S = {...BASE, timeStop:12}, t = bt(M, S, 10000).trades.find(x => x.reason === 'тайм-стоп');
  check('тайм-стоп: есть сделка, закрытая по времени', !!t);
  if (t) {
    const bar = t.time - TFMS + 1, cutAt = bar + 3 * TFMS, sg = t.side === 'LONG' ? 1 : -1;   // the entry bar; the coin's last candle
    const run = K => M.backtest({...hist, [t.sym]:K}, S, {start:10000, from}).trades.find(x => x.id === t.id);
    const gone = run(hist[t.sym].filter(k => k[0] <= cutAt));
    check('монета без свечей: позиция закрыта по тайм-стопу, а не в конце теста', gone?.reason === 'тайм-стоп', gone?.reason);
    check('монета без свечей: закрыта, когда вышло время', gone?.tclose === bar + 13 * TFMS - 1);
    check('монета без свечей: по последней цене монеты', near(gone?.exit, hist[t.sym].find(k => k[0] === cutAt)[4] * (1 - sg * M.SLIP)));
    // trading halted inside the trade and resumed after its time was up: the same moment and price
    const hole = run(hist[t.sym].filter(k => k[0] <= cutAt || k[0] > bar + 20 * TFMS));
    check('пауза торгов внутри сделки: тайм-стоп по времени, не по числу свечей', hole?.reason === 'тайм-стоп' && hole.tclose === gone?.tclose && hole.exit === gone?.exit);
  }
}

// ---------- 2d. random entries (randomSetup / randomTest): repeatable, as many trades, the same exits, ~50 % for luck ----------
{
  const S = BASE, base = bt(M, S, 10000), opts = {from, start:10000, seed:7};
  const nR = base.trades.filter(x => x.r != null && isFinite(x.r)).length;
  const a = M.randomTest(hist, S, base.trades, {...opts, runs:100}), b = M.randomTest(hist, S, base.trades, {...opts, runs:100});
  check('случайный вход: тот же результат с тем же зерном', !!a && a.pct === b.pct && a.mean === b.mean, a && `лучше ${a.pct.toFixed(1)} % · случайные ${a.mean.toFixed(3)}R`);
  const c = M.randomTest(hist, S, base.trades, {...opts, seed:8, runs:100});
  check('случайный вход: другое зерно — другие прогоны', !!c && c.mean !== a.mean);
  const X = M.randomSetup(hist, S, base.trades, opts), r5 = X.run(5, true);
  check('случайный вход: сделок столько же, сколько у стратегии', X.n === nR && r5.trades.length === nR && r5.n === nR, `${nR}`);
  check('случайный вход: прогон k не зависит от порядка', (() => { const Y = M.randomSetup(hist, S, base.trades, opts); for (let k = 0; k < 5; k++) Y.run(k); return JSON.stringify(Y.run(5, true).trades) === JSON.stringify(r5.trades); })());
  check('случайный вход: стоп 0.8–2.5 %, выходы стратегии, вход в периоде', r5.trades.every(x => { const d = Math.abs(x.entry - x.sl) / x.entry; return d >= 0.008 - 1e-12 && d <= 0.025 + 1e-12 && ['стоп', 'тейк', 'тайм-стоп', 'конец теста'].includes(x.reason) && x.time >= from && x.tclose >= x.time; }));
  check('случайный вход: тайм-стоп не дольше заданного', r5.trades.filter(x => x.reason === 'тайм-стоп').every(x => x.tclose - x.time <= S.timeStop * TFMS + 1));
  const ratios = new Set(base.trades.map(x => (Math.abs(x.tp - x.entry) / Math.abs(x.entry - x.sl)).toFixed(6)));
  check('случайный вход: тейк : стоп — как у сделок стратегии', r5.trades.every(x => ratios.has((Math.abs(x.tp - x.entry) / Math.abs(x.entry - x.sl)).toFixed(6))));
  const rr2 = M.randomSetup(hist, {...S, rr:2}, base.trades, opts).run(0, true).trades;
  check('случайный вход: при RR 1:2 тейк ровно в 2 стопа', rr2.every(x => near(Math.abs(x.tp - x.entry), 2 * Math.abs(x.entry - x.sl), 1e-9)));
  check('случайный вход: R посчитан с комиссией (стоп хуже −1R)', r5.trades.filter(x => x.reason === 'стоп').every(x => x.r < -1));
  // a strategy that is luck itself: runs of another seed ranked among 300 runs — on average about half of them are beaten
  const means = Array.from({length:300}, (_, k) => X.run(k).mean), Z = M.randomSetup(hist, S, base.trades, {...opts, seed:99});
  const avgPct = Array.from({length:60}, (_, k) => M.randomRank(Z.run(k).mean, means).pct).reduce((s, x) => s + x, 0) / 60;
  check('случайный вход: случайная «стратегия» лучше ~50 % прогонов', avgPct > 40 && avgPct < 60, avgPct.toFixed(1) + ' %');
  check('randomRank: ничья — половина', M.randomRank(0, [-1, 0, 1, 2]).pct === 37.5);
  // top 1: every random trade is on the coin with the largest 24 h turnover at the first bar of its hour
  const T1 = M.randomSetup(hist, S, base.trades, {...opts, top:1}).run(0, true).trades, day = 24;
  const turn = (s, T) => { const K = hist[s], i = K.findIndex(k => k[0] === T); let v = 0; for (let j = Math.max(0, i - day + 1); j <= i; j++) v += K[j][5] * K[j][4]; return v; };
  check('случайный вход: топ на каждый момент, как у бэктеста', T1.every(x => { const T = Math.floor((x.time - TFMS + 1) / 36e5) * 36e5; return Object.keys(hist).sort((p, q) => turn(q, T) - turn(p, T))[0] === x.sym; }));
}

// ---------- 3. against the previous copy: nothing else changed ----------
const refPath = new URLSearchParams(location.search).get('ref');
if (refPath) {
  try {
    const R = await import(new URL(refPath, location.href).href);
    check('отпечаток анализа не изменился (коллектор и бот договорятся)', M.fingerprint() === R.fingerprint());
    for (const [name, S] of Object.entries(VARIANTS)) for (const start of [10000, 2500]) {
      const a = bt(M, S, start), b = bt(R, S, start);
      check(`прежняя версия, ${name}, старт ${start}: сделки совпадают байт в байт`, JSON.stringify(a.trades) === JSON.stringify(b.trades) && a.balance === b.balance, `$${a.balance.toFixed(2)}`);
    }
  } catch (e) { check('прежняя версия загружена', false, String(e)); }
}

const sum = document.getElementById('sum');
sum.className = res.fail ? 'bad' : 'ok';
sum.textContent = res.fail ? `Провалено ${res.fail} из ${res.pass + res.fail}` : `Все ${res.pass} проверок пройдены`;
window.__TEST = res;
</script>
</body>
</html>
