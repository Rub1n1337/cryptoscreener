# Deploys the Supabase Edge Functions (bot, tg, auth) when they change on main, as Vercel deploys the site.
# Needs the repository secret SUPABASE_ACCESS_TOKEN: a Supabase access token scoped to this project with Edge Functions write.
# A function that needs a new column or database function must have its migration applied before the push (docs/LESSONS.md).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: aumldylzccbmddavtrqe
    steps:
      - uses: actions/checkout@v4
      # pinned: «latest» became the 3.0 major on 02.11.2026 and the deploy failed; move up only after a manual run passes
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # both share supabase/functions/_shared, so both go out together; called by pg_cron and Telegram, hence no JWT check
      - name: Deploy bot
        run: supabase functions deploy bot --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy tg
        run: supabase functions deploy tg --project-ref "$PROJECT_REF" --no-verify-jwt
      # sign-in through the bot: called by a tab that isn't signed in yet, hence no JWT check either
      - name: Deploy auth
        run: supabase functions deploy auth --project-ref "$PROJECT_REF" --no-verify-jwt
